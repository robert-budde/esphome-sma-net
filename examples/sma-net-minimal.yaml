esphome:
  name: sma-net-minimal
  friendly_name: "SMA Net Minimal"

external_components:
  - source:
      type: git
      url: https://github.com/robert-budde/esphome-sma-net.git
      ref: v1.0
    components: [sma_net]

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: INFO
  baud_rate: 0

api:

ota:
  - platform: esphome

uart:
  id: uart_sma
  tx_pin: GPIO21
  rx_pin: GPIO20
  baud_rate: 19200
  stop_bits: 1
  parity: NONE

sma_net:
  id: sma
  uart_id: uart_sma
  update_interval: 3s
  slow_factor: 20
  debug: false

sensor:
  - platform: sma_net
    sma_net_id: sma
    channel: Pac
    interval: fast
    name: "Pac"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement

text_sensor:
  - platform: sma_net
    sma_net_id: sma
    channel: "Mode"
    name: "Mode"
